<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="description" content="Rule-driven Yu-Gi-Oh style duels rendered as AI cinema on a zero-cost provider stack. Yugi vs Kaiba, Joey vs Mai." />
    <title>Duel Live</title>
    <style>
/* Duel Live — holographic duel arena. Dark-first: the arena is a light source,
   everything else recedes around it. */

:root {
  --bg: #05060d;
  --bg-raise: #0c1020;
  --bg-card: #121728;
  --line: #24304d;
  --line-soft: #1a2238;
  --ink: #e8eefc;
  --ink-dim: #92a1c4;
  --ink-faint: #5f6d90;
  --accent: #4fc9f0;
  --accent-warm: #f4c531;
  --danger: #ff5d6c;
  --good: #6ee7a8;
  --radius: 12px;
  --radius-sm: 7px;
  --shadow: 0 18px 48px rgba(0, 0, 0, 0.55);
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }

/* Class rules that set `display` outrank the UA rule for [hidden]; without this
   the modal and the media layers render even while marked hidden. */
[hidden] { display: none !important; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

.ambient { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.4; }
.orb-a { width: 46vw; height: 46vw; left: -12vw; top: -14vw; background: #1b3f7a; }
.orb-b { width: 40vw; height: 40vw; right: -10vw; bottom: -16vw; background: #5a1a52; }

/* ------------------------------------------------------------- topbar --- */

.topbar {
  position: relative; z-index: 2;
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; flex-wrap: wrap;
  padding: 14px clamp(12px, 3vw, 28px);
  border-bottom: 1px solid var(--line-soft);
  background: linear-gradient(180deg, rgba(10, 14, 28, 0.92), rgba(5, 6, 13, 0.7));
  backdrop-filter: blur(10px);
}

.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark {
  width: 30px; height: 30px; border-radius: 8px; flex: none;
  background: conic-gradient(from 210deg, var(--accent), var(--accent-warm), #b96bff, var(--accent));
  box-shadow: 0 0 22px rgba(79, 201, 240, 0.45);
}
.eyebrow {
  margin: 0; font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em;
  color: var(--accent); text-transform: uppercase;
}
.brand h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }

.topbar-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.control { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-faint); }
.control span { font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.08em; }
select, .btn {
  font-family: inherit; font-size: 12px; color: var(--ink);
  background: var(--bg-card); border: 1px solid var(--line);
  border-radius: var(--radius-sm); padding: 7px 11px; cursor: pointer;
  transition: border-color 0.15s, background 0.15s, transform 0.1s;
}
select:hover, .btn:hover { border-color: var(--accent); background: #182034; }
.btn:active { transform: translateY(1px); }
.btn-accent { background: var(--accent); color: #04121c; border-color: var(--accent); font-weight: 600; }
.btn-accent:hover { background: #7ad9f7; color: #04121c; }
.btn-wide { width: 100%; justify-content: center; padding: 10px; font-weight: 600; }
.btn[aria-pressed="false"] { color: var(--ink-faint); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* -------------------------------------------------------------- arena --- */

.arena-wrap {
  position: relative; z-index: 1;
  display: grid; grid-template-columns: minmax(0, 1fr) 300px;
  gap: 16px; padding: 16px clamp(12px, 3vw, 28px) 0;
  align-items: start;
}

.arena {
  position: relative; aspect-ratio: 16 / 9; width: 100%;
  border: 1px solid var(--line); border-radius: var(--radius);
  overflow: hidden; box-shadow: var(--shadow); background: #070b18;
}

.stage-canvas { cursor: pointer; }
.stage-canvas, .stage-media {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; display: block;
}
.stage-media { opacity: 0; transition: opacity 0.55s ease; z-index: 1; }
.stage-media.is-live { opacity: 1; }
.stage-vignette {
  position: absolute; inset: 0; z-index: 2; pointer-events: none;
  background:
    radial-gradient(ellipse at center, transparent 58%, rgba(0, 0, 0, 0.55) 100%),
    repeating-linear-gradient(0deg, rgba(120, 200, 255, 0.035) 0 1px, transparent 1px 3px);
}

.duelist-bar {
  position: absolute; z-index: 4; left: 12px; right: 12px;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 7px 11px; border-radius: 9px;
  background: rgba(6, 9, 18, 0.78); border: 1px solid var(--line-soft);
  backdrop-filter: blur(6px);
}
.duelist-bar--foe { top: 12px; }
.duelist-bar--me { bottom: 12px; }
.duelist-id { display: flex; align-items: center; gap: 8px; min-width: 150px; }
.duelist-id strong { display: block; font-size: 13px; }
.duelist-id small { display: block; font-size: 10px; color: var(--ink-faint); }
.pip { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px currentColor; }

.lp-block { display: flex; align-items: center; gap: 9px; flex: 1; min-width: 130px; }
.lp-track {
  flex: 1; height: 7px; border-radius: 4px; overflow: hidden;
  background: #1a2136; border: 1px solid var(--line-soft);
}
.lp-track i {
  display: block; height: 100%; width: 100%;
  background: linear-gradient(90deg, var(--good), var(--accent));
  transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}
.lp-track i.is-low { background: linear-gradient(90deg, var(--danger), #ff9a5c); }
.lp-num { font-family: var(--mono); font-size: 15px; font-weight: 600; min-width: 52px; text-align: right; }
.lp-num.is-hit { animation: lp-hit 0.5s ease; color: var(--danger); }
@keyframes lp-hit {
  0%, 100% { transform: none; }
  25% { transform: translateX(-5px) scale(1.12); }
  60% { transform: translateX(4px) scale(1.06); }
}
.counts { display: flex; gap: 8px; font-family: var(--mono); font-size: 10px; color: var(--ink-faint); }

/* --------------------------------------------------------------- zones --- */

/* Height-driven so four rows always fit the arena: each row is a fixed slice of
   the arena height and the zones take their width from their card ratio. */
.zones {
  position: absolute; z-index: 3; left: 50%; transform: translateX(-50%);
  display: flex; justify-content: center; align-items: stretch;
  gap: clamp(4px, 0.9vw, 10px); height: 15%; width: 88%;
}
.zones--foe { top: 11%; }
.zones--foe-monsters { top: 28%; }
.zones--me-monsters { bottom: 28%; }
.zones--me { bottom: 11%; }

.zone {
  position: relative; height: 100%; flex: none;
  aspect-ratio: 59 / 86; border-radius: 5px;
  border: 1px dashed rgba(140, 190, 255, 0.38);
  background: rgba(18, 28, 54, 0.55);
  box-shadow: inset 0 0 12px rgba(90, 150, 220, 0.12);
  display: grid; place-items: center; padding: 3px;
  font-size: 9px; text-align: center; overflow: hidden;
  transition: border-color 0.18s, box-shadow 0.18s, transform 0.18s;
}
.zone.is-filled {
  border-style: solid; border-color: var(--slot-accent, var(--accent));
  background: linear-gradient(165deg, rgba(24, 34, 60, 0.95), rgba(9, 13, 26, 0.95));
  box-shadow: 0 0 14px -3px var(--slot-accent, var(--accent)), inset 0 1px 0 rgba(255, 255, 255, 0.06);
}
.zone.is-facedown {
  background: repeating-linear-gradient(135deg, #2b1e46 0 6px, #1d1533 6px 12px);
  border-color: #6b4fa8; color: transparent;
}
.zone.is-defense { transform: rotate(-90deg) scale(0.84); }
.zone.is-target { cursor: pointer; border-color: var(--danger); box-shadow: 0 0 16px -2px var(--danger); }
.zone.is-ready { cursor: pointer; border-color: var(--accent-warm); box-shadow: 0 0 16px -2px var(--accent-warm); }
.zone.is-attacking { animation: lunge 0.45s ease; }
@keyframes lunge {
  0%, 100% { transform: none; }
  40% { transform: translateY(var(--lunge, -14px)) scale(1.06); }
}
.zone-name {
  position: absolute; inset: auto 2px 2px; font-size: 8px; line-height: 1.15;
  font-weight: 600; color: var(--ink); text-shadow: 0 1px 3px #000;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.zone-stat {
  position: absolute; top: 2px; right: 3px; font-family: var(--mono);
  font-size: 8px; font-weight: 700; color: var(--accent-warm); text-shadow: 0 1px 3px #000;
}
.zone-art { position: absolute; inset: 0; width: 100%; height: 100%; }

/* ------------------------------------------------------------- caption --- */

.shot-caption {
  position: absolute; z-index: 5; left: 50%; top: 50%;
  transform: translate(-50%, -50%); text-align: center;
  padding: 14px 26px; border-radius: 10px; max-width: 76%;
  background: rgba(4, 7, 16, 0.74); border: 1px solid var(--line);
  backdrop-filter: blur(8px); animation: caption-in 0.4s ease;
}
@keyframes caption-in {
  from { opacity: 0; transform: translate(-50%, -42%) scale(0.96); }
  to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}
.shot-kind {
  display: inline-block; font-family: var(--mono); font-size: 9px;
  letter-spacing: 0.2em; color: #04121c; background: var(--accent);
  padding: 2px 8px; border-radius: 3px; margin-bottom: 7px;
}
.shot-caption strong { display: block; font-size: clamp(17px, 2.4vw, 27px); letter-spacing: -0.02em; }
.shot-caption small { display: block; margin-top: 4px; font-size: 11px; color: var(--ink-dim); }
.shot-tier {
  display: block; margin-top: 7px; font-family: var(--mono);
  font-size: 8px; letter-spacing: 0.16em; color: var(--ink-faint); text-transform: uppercase;
}

/* -------------------------------------------------------------- banter --- */

.banter {
  position: absolute; z-index: 6; left: 50%; bottom: 17%;
  transform: translateX(-50%); width: min(660px, 80%);
  padding: 9px 16px; border-radius: 10px;
  /* Sits over the backrow like a subtitle: readable, but the board reads through. */
  background: linear-gradient(180deg, rgba(5, 8, 18, 0.82), rgba(5, 8, 18, 0.62));
  box-shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.8);
  border: 1px solid var(--banter-accent, var(--line));
  border-left: 3px solid var(--banter-accent, var(--accent));
  backdrop-filter: blur(8px);
  animation: banter-in 0.32s cubic-bezier(0.2, 0.9, 0.3, 1);
}
@keyframes banter-in {
  from { opacity: 0; transform: translate(-50%, 10px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}
.banter-who {
  display: block; font-family: var(--mono); font-size: 9.5px;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--banter-accent, var(--accent)); margin-bottom: 3px;
}
.banter-text {
  margin: 0; font-size: clamp(13px, 1.5vw, 16px); line-height: 1.35;
  font-style: italic; color: var(--ink);
}

.log li.is-banter {
  font-style: italic; background: #0d1322;
  border-left-color: var(--banter-accent, var(--accent-warm));
}

/* ---------------------------------------------------------------- side --- */

.side {
  display: flex; flex-direction: column; gap: 11px;
  padding: 13px; border: 1px solid var(--line-soft); border-radius: var(--radius);
  background: rgba(9, 13, 26, 0.6); max-height: calc(100vh - 150px);
}
.phase-rail { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.phase {
  font-family: var(--mono); font-size: 9px; text-align: center; padding: 6px 2px;
  border-radius: 5px; background: #121728; color: var(--ink-faint);
  border: 1px solid transparent; letter-spacing: 0.04em;
}
.phase.is-now { background: var(--accent); color: #04121c; font-weight: 700; }

.recovery { display: flex; gap: 6px; }
.recovery .btn { flex: 1; font-size: 11px; padding: 7px 6px; }
.btn-ghost { color: var(--ink-dim); }
.btn-warn { border-color: var(--accent-warm); color: var(--accent-warm); }
.btn-warn:hover { border-color: var(--accent-warm); background: rgba(244, 197, 49, 0.12); }

.prompt {
  padding: 10px; border-radius: 8px; font-size: 12px;
  border: 1px solid var(--accent-warm); background: rgba(244, 197, 49, 0.09);
}
.prompt p { margin: 0 0 8px; }
.prompt-actions { display: flex; flex-direction: column; gap: 5px; }
.prompt-actions .btn { text-align: left; font-size: 11px; }

.side-heading {
  margin: 2px 0 0; font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.16em; color: var(--ink-faint); text-transform: uppercase;
}
.log {
  list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1;
  font-size: 11.5px; display: flex; flex-direction: column; gap: 5px; min-height: 90px;
}
.log li {
  padding: 5px 8px; border-radius: 5px; background: #101526;
  border-left: 2px solid var(--line); color: var(--ink-dim);
}
.log li.is-me { border-left-color: var(--accent); }
.log li.is-foe { border-left-color: var(--danger); }
.log li.is-big { border-left-color: var(--accent-warm); color: var(--ink); font-weight: 600; }

/* ---------------------------------------------------------------- hand --- */

.hand-rail { position: relative; z-index: 1; padding: 14px clamp(12px, 3vw, 28px) 24px; }
.hand-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 9px; }
.hand-head h2 {
  margin: 0; font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.16em; color: var(--ink-faint); text-transform: uppercase;
}
#hand-hint { font-size: 11px; color: var(--ink-faint); }
.hand { display: flex; gap: 9px; overflow-x: auto; padding-bottom: 6px; }

.card {
  flex: none; width: 118px; padding: 8px; border-radius: 9px; cursor: pointer;
  background: linear-gradient(165deg, var(--bg-card), #0b0f1c);
  border: 1px solid var(--line); text-align: left;
  color: inherit; font: inherit;
  transition: transform 0.16s, border-color 0.16s, box-shadow 0.16s;
}
.card:hover:not(:disabled) {
  transform: translateY(-5px);
  border-color: var(--card-accent, var(--accent));
  box-shadow: 0 10px 26px -8px var(--card-accent, var(--accent));
}
.card:disabled { opacity: 0.42; cursor: not-allowed; }
.card-top { display: flex; justify-content: space-between; align-items: center; gap: 5px; margin-bottom: 5px; }
.card-kind {
  font-family: var(--mono); font-size: 8px; letter-spacing: 0.1em;
  padding: 2px 5px; border-radius: 3px; background: var(--card-accent, var(--accent)); color: #04121c;
}
.card-level { font-family: var(--mono); font-size: 9px; color: var(--accent-warm); }
.card-name { font-size: 11.5px; font-weight: 600; line-height: 1.25; margin-bottom: 4px; }
.card-stats { font-family: var(--mono); font-size: 9.5px; color: var(--ink-dim); }
.card-text {
  font-size: 9.5px; color: var(--ink-faint); line-height: 1.35; margin-top: 4px;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}

/* --------------------------------------------------------------- modal --- */

.modal {
  position: fixed; inset: 0; z-index: 40; display: grid; place-items: center;
  padding: 20px; background: rgba(2, 4, 10, 0.82); backdrop-filter: blur(5px);
}
.modal-card {
  width: min(560px, 100%); max-height: 82vh; overflow-y: auto;
  padding: 22px; border-radius: var(--radius);
  background: var(--bg-raise); border: 1px solid var(--line); box-shadow: var(--shadow);
}
.modal-card h2 { margin: 0 0 12px; font-size: 17px; }
.modal-body { font-size: 13px; color: var(--ink-dim); margin-bottom: 16px; }
.modal-body h3 { color: var(--ink); font-size: 12px; margin: 16px 0 5px; font-family: var(--mono); letter-spacing: 0.08em; text-transform: uppercase; }
.modal-body ul { margin: 0; padding-left: 18px; }
.modal-body li { margin-bottom: 4px; }
.modal-body code { font-family: var(--mono); font-size: 11px; color: var(--accent); }

@media (max-width: 900px) {
  .arena-wrap { grid-template-columns: minmax(0, 1fr); }
  .side { max-height: none; }
  .zones { width: 96%; height: 13%; gap: 4px; }
  .duelist-bar { position: static; margin: 0; border-radius: 0; }
  .arena { aspect-ratio: auto; min-height: 62vh; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

</style>
  </head>
  <body>
    <div class="ambient" aria-hidden="true"><span class="orb orb-a"></span><span class="orb orb-b"></span></div>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <p class="eyebrow">DUEL LIVE</p>
          <h1 id="matchup-name">Duel I — Battle City Finals</h1>
        </div>
      </div>
      <div class="topbar-actions">
        <label class="control" for="matchup-select">
          <span>Duel</span>
          <select id="matchup-select">
            <option value="yugi-kaiba">Yugi vs Kaiba</option>
            <option value="joey-mai">Joey vs Mai Valentine</option>
          </select>
        </label>
        <label class="control" for="tier-select">
          <span>Cinema</span>
          <select id="tier-select">
            <option value="video">Auto (best free tier)</option>
            <option value="still">AI stills only</option>
            <option value="procedural">Procedural only</option>
          </select>
        </label>
        <button class="btn" id="sound-btn" type="button" aria-pressed="true">Voice on</button>
        <button class="btn" id="rules-btn" type="button">Rules</button>
        <button class="btn btn-accent" id="restart-btn" type="button">New duel</button>
      </div>
    </header>

    <main class="arena-wrap">
      <section class="arena" aria-label="Duel arena">
        <canvas id="stage" class="stage-canvas" width="1280" height="720"></canvas>
        <img id="stage-still" class="stage-media" alt="" hidden />
        <video id="stage-video" class="stage-media" muted playsinline preload="auto" hidden></video>
        <div class="stage-vignette" aria-hidden="true"></div>

        <div class="duelist-bar duelist-bar--foe">
          <div class="duelist-id">
            <span class="pip" id="foe-pip"></span>
            <div><strong id="foe-name">Seto Kaiba</strong><small id="foe-title">CEO of KaibaCorp</small></div>
          </div>
          <div class="lp-block">
            <div class="lp-track"><i id="foe-lp-fill"></i></div>
            <span class="lp-num" id="foe-lp">8000</span>
          </div>
          <div class="counts"><span id="foe-hand">H 5</span><span id="foe-deck">D 35</span><span id="foe-gy">GY 0</span></div>
        </div>

        <div class="zones zones--foe" id="foe-backrow" aria-label="Opponent spell and trap zones"></div>
        <div class="zones zones--foe-monsters" id="foe-monsters" aria-label="Opponent monster zones"></div>

        <div class="shot-caption" id="shot-caption" hidden>
          <span class="shot-kind" id="shot-kind">SUMMON</span>
          <strong id="shot-title"></strong>
          <small id="shot-sub"></small>
          <span class="shot-tier" id="shot-tier"></span>
        </div>

        <div class="zones zones--me-monsters" id="my-monsters" aria-label="Your monster zones"></div>
        <div class="zones zones--me" id="my-backrow" aria-label="Your spell and trap zones"></div>

        <div class="banter" id="banter" hidden>
          <span class="banter-who" id="banter-who"></span>
          <p class="banter-text" id="banter-text"></p>
        </div>

        <div class="duelist-bar duelist-bar--me">
          <div class="duelist-id">
            <span class="pip" id="me-pip"></span>
            <div><strong id="me-name">Yugi Muto</strong><small id="me-title">King of Games</small></div>
          </div>
          <div class="lp-block">
            <div class="lp-track"><i id="me-lp-fill"></i></div>
            <span class="lp-num" id="me-lp">8000</span>
          </div>
          <div class="counts"><span id="me-deck">D 35</span><span id="me-gy">GY 0</span><span id="me-turn">T1</span></div>
        </div>
      </section>

      <aside class="side">
        <div class="phase-rail" id="phase-rail" role="group" aria-label="Phase">
          <span class="phase" data-phase="draw">Draw</span>
          <span class="phase" data-phase="main1">Main</span>
          <span class="phase" data-phase="battle">Battle</span>
          <span class="phase" data-phase="end">End</span>
        </div>
        <button class="btn btn-wide" id="advance-btn" type="button">To Battle Phase</button>
        <div class="recovery">
          <button class="btn btn-ghost" id="skip-btn" type="button" hidden>Skip scene ⏭</button>
          <button class="btn btn-warn" id="resume-btn" type="button" hidden>Resume duel</button>
        </div>
        <div class="prompt" id="prompt" hidden>
          <p id="prompt-text"></p>
          <div class="prompt-actions" id="prompt-actions"></div>
        </div>
        <h2 class="side-heading">Duel log</h2>
        <ol class="log" id="log"></ol>
      </aside>
    </main>

    <section class="hand-rail" aria-label="Your hand">
      <div class="hand-head"><h2>Hand</h2><span id="hand-hint">Click a card to play it</span></div>
      <div class="hand" id="hand"></div>
    </section>

    <div class="modal" id="modal" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">

__def("src/duel-engine.js", {"./cards/index.js":"src/cards/index.js","./duel-effects.js":"src/duel-effects.js","./duel-state.js":"src/duel-state.js"}, function (__exports, __req) {
// The rules engine. It owns every outcome in a duel; the cinema layer only ever
// renders the events it emits. Actions are pure: apply* clones before mutating.

const { getCard } = __req("./cards/index.js");
const { applyEffect, dealDamage, findFusion, placeMonster, sendToGraveyard } = __req("./duel-effects.js");
const { cardOf, createDuel, drawInto, effectiveStats, emptyBackrowZone, emptyMonsterZone, monstersOn, mulberry32, other, SIDES } = __req("./duel-state.js");

const PHASES = ["draw", "main1", "battle", "end"];
const clone = (state) => structuredClone(state);

function rngFor(state) {
  return () => {
    state.rngCalls += 1;
    return mulberry32(state.seed + state.rngCalls * 7919)();
  };
}

function newCtx(state, extra = {}) {
  return { events: [], rng: rngFor(state), negateAttack: false, endBattlePhase: false, ...extra };
}

function tributesRequired(card) {
  if (card.level >= 7) return 2;
  if (card.level >= 5) return 1;
  return 0;
}

function tributeValue(state, side, inst) {
  const card = cardOf(inst);
  return card.doubleTributeFor ? 2 : 1;
}

function canNormalSummon(state, side, uid) {
  const s = state.sides[side];
  const inst = s.hand.find((c) => c.uid === uid);
  if (!inst) return false;
  const card = cardOf(inst);
  if (card.kind !== "monster" || card.fusion || card.noNormalSummon) return false;
  if (s.normalSummonUsed || emptyMonsterZone(state, side) < 0) return false;
  const need = tributesRequired(card);
  const available = monstersOn(state, side).reduce((sum, m) => sum + tributeValue(state, side, m), 0);
  return available >= need;
}

// ---------------------------------------------------------------- actions ---

function isFusionMaterial(state, side, inst) {
  return state.sides[side].extra.some((f) => getCard(f.cardId).fusion.includes(inst.cardId));
}

function actSummon(state, side, action, ctx) {
  const s = state.sides[side];
  const inst = s.hand.splice(s.hand.findIndex((c) => c.uid === action.uid), 1)[0];
  const card = cardOf(inst);
  let need = tributesRequired(card);
  // Tribute the weakest monsters first, but never eat a live fusion material
  // while an ordinary body is still available.
  const cost = (m) => effectiveStats(state, side, m).atk + (isFusionMaterial(state, side, m) ? 10000 : 0);
  const fodder = monstersOn(state, side).sort((a, b) => cost(a) - cost(b));
  while (need > 0 && fodder.length) {
    const victim = fodder.shift();
    need -= tributeValue(state, side, victim);
    sendToGraveyard(state, side, victim, ctx, "tribute");
  }
  s.normalSummonUsed = true;
  const position = action.set ? "defense" : (action.position ?? "attack");
  placeMonster(state, side, inst, ctx, { position, how: action.set ? "set" : "normal" });
  if (action.set) {
    const zone = s.monsters.indexOf(inst);
    s.monsters[zone].faceDown = true;
    ctx.events[ctx.events.length - 1].faceDown = true;
  }
  if (s.virusTurns > 0 && effectiveStats(state, side, inst).atk >= s.virusThreshold) {
    sendToGraveyard(state, side, inst, ctx, "crushVirus");
  }
}

function actSetBackrow(state, side, action, ctx) {
  const s = state.sides[side];
  const zone = emptyBackrowZone(state, side);
  if (zone < 0) return;
  const inst = s.hand.splice(s.hand.findIndex((c) => c.uid === action.uid), 1)[0];
  inst.faceDown = true;
  s.backrow[zone] = inst;
  ctx.events.push({ type: "set", side, kind: cardOf(inst).kind });
}

function actActivate(state, side, action, ctx) {
  const s = state.sides[side];
  const fromHand = s.hand.findIndex((c) => c.uid === action.uid);
  const inst = fromHand >= 0 ? s.hand.splice(fromHand, 1)[0] : s.backrow.find((c) => c && c.uid === action.uid);
  if (!inst) return;
  const card = cardOf(inst);
  ctx.events.push({ type: "activate", side, card: card.name, art: card.art, text: card.text });
  if (card.sub === "equip") {
    const zone = fromHand >= 0 ? emptyBackrowZone(state, side) : s.backrow.indexOf(inst);
    if (zone < 0) return;
    s.backrow[zone] = inst;
    inst.faceDown = false;
    const host = monstersOn(state, side).find((m) => equipFits(state, side, m, card)) ?? monstersOn(state, side)[0];
    if (host) host.equips.push(inst.uid);
    return;
  }
  applyEffect(state, side, card.effect, { ...ctx, target: action.target ?? ctx.target });
  if (fromHand >= 0) s.graveyard.push(inst);
  else if (card.sub !== "continuous") {
    s.backrow[s.backrow.indexOf(inst)] = null;
    s.graveyard.push(inst);
  } else inst.faceDown = false;
}

function equipFits(state, side, inst, equipCard) {
  const req = equipCard.effect?.requires;
  if (!req) return true;
  const card = cardOf(inst);
  if (req.attribute) return card.attribute === req.attribute;
  if (req.type) return card.type === req.type;
  if (req.name) return card.name === req.name || card.treatedAs === req.name;
  return true;
}

function requirementMet(state, side, card) {
  const req = card.effect?.requires;
  if (!req || typeof req !== "string") return true;
  return monstersOn(state, side).some((m) => m.cardId === req && !m.faceDown);
}

function actPosition(state, side, action, ctx) {
  const inst = monstersOn(state, side).find((m) => m.uid === action.uid);
  if (!inst || inst.summonedThisTurn || inst.hasAttacked) return;
  inst.position = inst.position === "attack" ? "defense" : "attack";
  inst.faceDown = false;
  ctx.events.push({ type: "position", side, card: cardOf(inst).name, position: inst.position });
}

// ----------------------------------------------------------------- battle ---

function canAttack(state, side, inst) {
  const s = state.sides[side];
  if (state.phase !== "battle" || state.activeSide !== side) return false;
  if (inst.hasAttacked || inst.faceDown || inst.position !== "attack" || inst.bound) return false;
  if (s.lockAttacksTurns > 0) return false;
  if (state.gravityBindLevel && cardOf(inst).level >= state.gravityBindLevel) return false;
  return true;
}

function resolveBattle(state, side, attacker, defender, ctx) {
  const foe = other(side);
  const a = effectiveStats(state, side, attacker).atk;
  if (!defender) {
    dealDamage(state, foe, a, ctx, "direct");
    ctx.events.push({ type: "directAttack", side, card: cardOf(attacker).name, damage: a });
    return;
  }
  if (defender.faceDown) {
    defender.faceDown = false;
    ctx.events.push({ type: "flip", side: foe, card: cardOf(defender).name });
  }
  const d = effectiveStats(state, foe, defender);
  const wall = defender.position === "attack" ? d.atk : d.def;
  ctx.events.push({
    type: "clash", side, attacker: cardOf(attacker).name, defender: cardOf(defender).name,
    attackerAtk: a, defenderValue: wall, defenderPosition: defender.position,
  });
  if (a > wall) {
    sendToGraveyard(state, foe, defender, ctx, "battle");
    if (defender.position === "attack") dealDamage(state, foe, a - wall, ctx, "battle");
  } else if (a < wall) {
    if (defender.position === "attack") sendToGraveyard(state, side, attacker, ctx, "battle");
    dealDamage(state, side, wall - a, ctx, "battle");
    if (cardOf(defender).reflectBattleDamage) dealDamage(state, foe, wall - a, ctx, "amazoness");
  } else if (defender.position === "attack") {
    sendToGraveyard(state, foe, defender, ctx, "battle");
    sendToGraveyard(state, side, attacker, ctx, "battle");
  }
}

function actAttack(state, side, action, ctx) {
  const attacker = monstersOn(state, side).find((m) => m.uid === action.uid);
  if (!attacker || !canAttack(state, side, attacker)) return;
  const foe = other(side);
  const targets = monstersOn(state, foe);
  const defender = action.targetUid ? targets.find((m) => m.uid === action.targetUid) : (targets[0] ?? null);
  attacker.hasAttacked = true;
  ctx.events.push({ type: "declare", side, card: cardOf(attacker).name, target: defender ? cardOf(defender).name : "direct" });

  const window = trapWindow(state, foe, "onAttack");
  if (window.length && !ctx.skipTrapWindow) {
    state.pending = {
      kind: "trapWindow", side: foe, options: window.map((c) => c.uid),
      resume: { action, attackerUid: attacker.uid, defenderUid: defender?.uid ?? null },
    };
    return;
  }
  if (state.sides[foe].hats && targets.length) {
    const hit = ctx.rng() < 1 / state.sides[foe].hats.odds;
    ctx.events.push({ type: "hats", side: foe, hit });
    state.sides[foe].hats = null;
    if (!hit) return;
  }
  resolveBattle(state, side, attacker, defender, ctx);
}

function trapWindow(state, side, trigger) {
  return state.sides[side].backrow.filter((inst) => {
    if (!inst || !inst.faceDown) return false;
    const card = cardOf(inst);
    return card.kind === "trap" && card.trigger === trigger;
  });
}

// ------------------------------------------------------------- turn cycle ---

function endOfTurnCleanup(state, ctx) {
  for (const side of SIDES) {
    const s = state.sides[side];
    for (const inst of monstersOn(state, side)) {
      if (inst.tempUntilEndOfTurn) { inst.atkMod = 0; inst.defMod = 0; inst.tempUntilEndOfTurn = false; }
      if (inst.borrowedFrom) {
        s.monsters[s.monsters.indexOf(inst)] = null;
        const home = state.sides[inst.borrowedFrom];
        const zone = home.monsters.indexOf(null);
        delete inst.borrowedFrom;
        if (zone >= 0) home.monsters[zone] = inst; else home.graveyard.push(inst);
      }
    }
    while (s.hand.length > 6) sendToGraveyard(state, side, s.hand.pop(), ctx, "handLimit");
  }
}

function startTurn(state, ctx) {
  const side = state.activeSide;
  const s = state.sides[side];
  s.normalSummonUsed = false;
  s.lockAttacksTurns = Math.max(0, s.lockAttacksTurns - 1);
  s.virusTurns = Math.max(0, s.virusTurns - 1);
  for (const inst of monstersOn(state, side)) {
    inst.hasAttacked = false;
    inst.summonedThisTurn = false;
    inst.bound = false;
  }
  ctx.events.push({ type: "phase", phase: "draw", side, turn: state.turn });
  const card = drawInto(s);
  if (!card) { finish(state, other(side), "deckout", ctx); return; }
  ctx.events.push({ type: "draw", side, card: cardOf(card).name, uid: card.uid });
  state.phase = "main1";
}

function finish(state, winner, reason, ctx) {
  state.winner = winner;
  state.winReason = reason;
  ctx.events.push({ type: "win", side: winner, reason });
}

function checkWin(state, ctx) {
  if (state.winner) return;
  for (const side of SIDES) {
    if (state.sides[side].lp <= 0) finish(state, other(side), "lifePoints", ctx);
  }
}

function endTurn(state) {
  const next = clone(state);
  const ctx = newCtx(next);
  endOfTurnCleanup(next, ctx);
  next.activeSide = other(next.activeSide);
  next.turn += 1;
  next.phase = "draw";
  startTurn(next, ctx);
  checkWin(next, ctx);
  return { state: next, events: ctx.events };
}

function setPhase(state, phase) {
  if (!PHASES.includes(phase)) throw new Error(`Unknown phase: ${phase}`);
  const next = clone(state);
  next.phase = phase;
  return { state: next, events: [{ type: "phase", phase, side: next.activeSide, turn: next.turn }] };
}

// Duel state construction, card instances, and derived stats.
// Pure data + pure readers -- no mutation of caller-owned state lives here.

const { getCard } = __req("./cards/index.js");
const { getDuelist, getMatchup } = __req("./duelists.js");
const SIDES = ["player", "opponent"];
const other = (side) => (side === "player" ? "opponent" : "player");

function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffle(list, rng) {
  const out = list.slice();
  for (let i = out.length - 1; i > 0; i -= 1) {
    const j = Math.floor(rng() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

let uidCounter = 0;
function makeInstance(cardId, owner) {
  uidCounter += 1;
  return {
    uid: `${cardId}#${uidCounter}`,
    cardId,
    owner,
    faceDown: false,
    position: "attack",
    hasAttacked: false,
    summonedThisTurn: false,
    bound: false,
    atkMod: 0,
    defMod: 0,
    equips: [],
  };
}

function resetUidCounter(value = 0) {
  uidCounter = value;
}

function createSide(duelistId, lifePoints, rng) {
  const duelist = getDuelist(duelistId);
  const deck = shuffle(duelist.deck, rng).map((id) => makeInstance(id, duelistId));
  return {
    duelistId,
    lp: lifePoints,
    deck,
    hand: [],
    extra: duelist.extra.map((id) => makeInstance(id, duelistId)),
    monsters: Array(5).fill(null),
    backrow: Array(5).fill(null),
    graveyard: [],
    normalSummonUsed: false,
    lockAttacksTurns: 0,
    gravityBind: 0,
    virusTurns: 0,
    virusThreshold: 0,
    hats: null,
  };
}

function createDuel(matchupId, { seed = Date.now() } = {}) {
  const matchup = getMatchup(matchupId);
  if (!matchup) throw new Error(`Unknown matchup: ${matchupId}`);
  const rng = mulberry32(seed);
  const state = {
    matchupId,
    seed,
    turn: 1,
    phase: "main1",
    activeSide: "player",
    winner: null,
    winReason: null,
    pending: null,
    rngCalls: 0,
    sides: {
      player: createSide(matchup.player, matchup.lifePoints, rng),
      opponent: createSide(matchup.opponent, matchup.lifePoints, rng),
    },
  };
  for (const side of SIDES) {
    for (let i = 0; i < 5; i += 1) drawInto(state.sides[side]);
  }
  return state;
}

  const card = sideState.deck.shift();
  if (!card) return null;
  sideState.hand.push(card);
  return card;
}

const cardOf = (inst) => getCard(inst.cardId);

function equipBonus(sideState, inst, key) {
  return inst.equips.reduce((sum, uid) => {
    const eq = sideState.backrow.find((s) => s && s.uid === uid);
    return sum + (eq ? (getCard(eq.cardId).effect?.[key] ?? 0) : 0);
  }, 0);
}

  const mine = state.sides[side];
  const foe = state.sides[other(side)];
  let bonus = 0;
  if (card.atkPerFoeType) {
    const hits = foe.monsters.filter((s) => s && getCard(s.cardId).type === card.atkPerFoeType.type);
    bonus += hits.length * card.atkPerFoeType.atk;

    const hits = mine.monsters.filter((s) => s && s.uid !== inst.uid && matchesName(s, card.atkPerAlly.name));
    bonus += hits.length * card.atkPerAlly.atk;

    card.atk + inst.atkMod + equipBonus(mine, inst, "atk") + conditionalAtk(state, side, inst),

function drawCaster(ctx, s) {

  ctx.quadraticCurveTo(-s * 0.5, s * 0.2, -s * 0.34, s * 0.92);
  ctx.lineTo(s * 0.34, s * 0.92);

  ctx.quadraticCurveTo(-s * 0.42, -s * 0.2, 0, -s * 0.5);

  ctx.beginPath();
  ctx.moveTo(0, -s * 0.85);
  for (let i = 1; i < 7; i += 1) {
    const a = (i / 7) * Math.PI * 2 - Math.PI / 2;

function drawMonster(ctx, card, { x, y, scale, flip = false, alpha = 1, t = 0 }) {

  grad.addColorStop(0.45, palette.core);

  ctx.lineJoin = "round";

function drawFloorGrid(ctx, w, h, horizon, accent, t) {
  ctx.save();
  ctx.strokeStyle = `${accent}77`;
  ctx.lineWidth = 1.4;
  const drift = (t * 0.02) % 40;
  for (let i = 0; i < 22; i += 1) {
    const y = horizon + ((i * 40 + drift) ** 1.35) / 90;
    if (y > h) break;

    ctx.lineTo(w / 2 + i * (w / 4), h);
    ctx.stroke();
  }
  ctx.restore();
}

function drawArena(ctx, w, h, { accentA, accentB, t = 0 }) {
  const sky = ctx.createLinearGradient(0, 0, 0, h);

  sky.addColorStop(0.5, "#141d3c");
  sky.addColorStop(1, "#070b1a");

  halo.addColorStop(0, `${accentA}77`);
  halo.addColorStop(0.45, `${accentA}22`);
  halo.addColorStop(1, "transparent");
  ctx.fillStyle = halo;
  ctx.fillRect(0, 0, w, h);

  // A bright band on the horizon line keeps the arena reading as a lit stage
  // rather than an empty black rectangle.
  const band = ctx.createLinearGradient(0, horizon - h * 0.09, 0, horizon + h * 0.05);
  band.addColorStop(0, "transparent");
  band.addColorStop(0.62, `${accentB}66`);
  band.addColorStop(1, "transparent");
  ctx.fillStyle = band;
  ctx.fillRect(0, horizon - h * 0.09, w, h * 0.14);

  drawFloorGrid(ctx, w, h, horizon, accentB, t);
  return horizon;
}

function drawBeam(ctx, from, to, palette, progress) {
  const x = from.x + (to.x - from.x) * progress;
  const y = from.y + (to.y - from.y) * progress;
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  const grad = ctx.createLinearGradient(from.x, from.y, x, y);
  grad.addColorStop(0, "transparent");
  grad.addColorStop(1, palette.glow);
  ctx.strokeStyle = grad;
  ctx.lineWidth = 14 + Math.sin(progress * Math.PI) * 22;
  ctx.lineCap = "round";
  ctx.shadowColor = palette.core;
  ctx.shadowBlur = 40;
  ctx.beginPath();
  ctx.moveTo(from.x, from.y);
  ctx.lineTo(x, y);
  ctx.stroke();
  ctx.restore();
}

function drawImpact(ctx, x, y, palette, progress) {
  const r = progress * 190;
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.globalAlpha = Math.max(0, 1 - progress);
  ctx.strokeStyle = palette.glow;
  ctx.lineWidth = 10 * (1 - progress) + 2;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y, r * 0.55, 0, Math.PI * 2); ctx.stroke();
  for (let i = 0; i < 12; i += 1) {
    const a = (i / 12) * Math.PI * 2;
    const len = r * (0.7 + (i % 3) * 0.22);
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(a) * r * 0.4, y + Math.sin(a) * r * 0.4);
    ctx.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len);
    ctx.stroke();
  }
  ctx.restore();
}

function drawScanlines(ctx, w, h, t) {
  ctx.save();
  ctx.globalAlpha = 0.05;
  ctx.fillStyle = "#9fe8ff";
  for (let y = (t * 0.05) % 4; y < h; y += 4) ctx.fillRect(0, y, w, 1);
  ctx.restore();
}

// Tiered cinema provider. Every tier is free; higher tiers are slower and need
// a free key, so the runway always falls back rather than stalling the duel.
//
//   0 procedural  canvas holograms      no key, no network, instant
//   1 still       AI key art + camera   no key, ~1-20s
//   2 video       AI video clip         free key, ~30-120s
//
// Tier 2 is prefetched while tier 0/1 is on screen, exactly so the player never
// waits on a generator.

const TIERS = ["procedural", "still", "video"];

const jobs = new Map();
let capability = { still: true, video: false, voice: false, realtime: false, checked: false };

function getCapability() {
  return { ...capability };
}

async function probeCapability(fetchImpl = fetch) {
  try {
    const res = await fetchImpl("/api/capability");
    if (res.ok) capability = { ...(await res.json()), checked: true };
  } catch {
    capability = { still: false, video: false, voice: false, realtime: false, checked: true };
  }
  return getCapability();
}

function highestTier(requested = "video") {
  const cap = getCapability();
  const wanted = TIERS.indexOf(requested);
  let best = 0;
  if (cap.still && wanted >= 1) best = 1;
  if (cap.video && wanted >= 2) best = 2;
  return TIERS[best];
}

function shotBody(shot, tier) {
  return {
    id: shot.id,
    tier,
    prompt: shot.prompt,
    seconds: shot.seconds ?? 6,
    kind: shot.kind,
  };
}

// Kicks off generation without awaiting it, so the caller can keep playing the
// procedural shot while the network works.
function prefetch(shot, tier = highestTier(), fetchImpl = fetch) {
  if (tier === "procedural") return null;
  const key = `${shot.id}:${tier}`;
  if (jobs.has(key)) return jobs.get(key);
  const job = fetchImpl("/api/shot", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(shotBody(shot, tier)),
  })
    .then(async (res) => {
      if (!res.ok) throw new Error(`shot ${res.status}`);
      const data = await res.json();
      if (!data.url) throw new Error("shot returned no url");
      return { ...data, tier, shotId: shot.id };
    })
    .catch((error) => ({ error: String(error), tier, shotId: shot.id }));
  jobs.set(key, job);
  return job;
}

// Resolves as soon as a usable asset exists, or `null` once the budget is spent
// -- callers treat null as "stay procedural", never as an error.
async function resolve(shot, { tier = highestTier(), timeoutMs = 0, fetchImpl = fetch } = {}) {
  if (tier === "procedural") return null;
  const job = prefetch(shot, tier, fetchImpl);
  if (!job) return null;
  if (!timeoutMs) {
    const result = await job;
    return result.error ? null : result;
  }
  const raced = await Promise.race([
    job,
    new Promise((done) => setTimeout(() => done({ timeout: true }), timeoutMs)),
  ]);
  if (raced.timeout || raced.error) return null;
  return raced;
}

function clearJobs() {
  jobs.clear();
}

function jobCount() {
  return jobs.size;
}

// A shot is worth spending a slow video generation on only if it is a moment
// the player will remember. Everything else stays on the fast tiers.
function deservesVideo(shot) {
  return shot.kind === "fusion" || shot.kind === "finish" || shot.kind === "direct"
    || (shot.kind === "clash" && (shot.event?.attackerAtk ?? 0) >= 2000)
    || (shot.kind === "summon" && (shot.event?.atk ?? 0) >= 2400)
    || shot.kind === "trap";
}

function planTiers(shots, { videoBudget = 2 } = {}) {
  const best = highestTier();
  let left = best === "video" ? videoBudget : 0;
  return shots.map((shot) => {
    if (left > 0 && deservesVideo(shot)) {
      left -= 1;
      return { shot, tier: "video" };
    }
    return { shot, tier: best === "procedural" ? "procedural" : "still" };
  });
}

Object.assign(__exports, { getCapability, probeCapability, highestTier, prefetch, resolve, clearJobs, jobCount, deservesVideo, planTiers, TIERS });
});

// Duelist voice. Tier 0 is the browser's own speech synthesiser -- free, offline
// and instant -- so a duel always has a voice even with no key and no network.

const VOICES = {
  yugi:  { rate: 1.0, pitch: 1.15, match: /(male|daniel|alex|fred)/i },
  kaiba: { rate: 0.92, pitch: 0.72, match: /(male|daniel|alex|oliver)/i },
  joey:  { rate: 1.12, pitch: 1.0, match: /(male|fred|alex)/i },
  mai:   { rate: 1.0, pitch: 1.35, match: /(female|samantha|karen|moira)/i },
};

let remoteOk = false;
let audioEl = null;

function enableRemoteVoice(enabled) {
  remoteOk = Boolean(enabled);
}

function pickVoice(profile) {
  const all = globalThis.speechSynthesis?.getVoices?.() ?? [];
  return all.find((v) => profile.match.test(`${v.name} ${v.voiceURI}`)) ?? all[0] ?? null;
}

function speakLocal(text, duelistId) {
  const synth = globalThis.speechSynthesis;
  if (!synth || !text) return false;
  const profile = VOICES[duelistId] ?? VOICES.yugi;
  synth.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = profile.rate;
  utter.pitch = profile.pitch;
  const voice = pickVoice(profile);
  if (voice) utter.voice = voice;
  synth.speak(utter);
  return true;
}

async function speakRemote(text, duelistId, fetchImpl) {
  const res = await fetchImpl("/api/voice", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ text, duelist: duelistId }),
  });
  if (!res.ok) throw new Error(`voice ${res.status}`);
  const blob = await res.blob();
  audioEl ??= new Audio();
  audioEl.src = URL.createObjectURL(blob);
  audioEl.volume = 0.9;
  await audioEl.play();
  return true;
}

async function speak(text, duelistId, { fetchImpl = fetch, muted = false } = {}) {
  if (muted || !text) return false;
  if (remoteOk) {
    try {
      return await speakRemote(text, duelistId, fetchImpl);
    } catch {
      // fall through to the always-available local voice
    }
  }
  return speakLocal(text, duelistId);
}

function stopVoice() {
  globalThis.speechSynthesis?.cancel?.();
  if (audioEl) { audioEl.pause(); audioEl.currentTime = 0; }
}

Object.assign(__exports, { enableRemoteVoice, speak, stopVoice });
});

const el = (id) => document.getElementById(id);
const KIND_LABEL = { monster: "MON", spell: "SPELL", trap: "TRAP" };

function accentFor(card) {
  if (card.kind === "spell") return "#6ee7a8";
  if (card.kind === "trap") return "#ff9ec4";
  return (ATTRIBUTE_PALETTE[card.attribute] ?? ATTRIBUTE_PALETTE.DARK).core;
}

function renderZones(state, side, container, { onZoneClick, targets = new Set(), ready = new Set(), row = "monsters" }) {
  container.innerHTML = "";
  state.sides[side][row].forEach((inst, index) => {
    const zone = document.createElement("div");
    zone.className = "zone";
    zone.dataset.index = String(index);
    if (inst) {
      const card = getCard(inst.cardId);
      zone.classList.add("is-filled");
      zone.style.setProperty("--slot-accent", accentFor(card));
      if (inst.faceDown) zone.classList.add("is-facedown");
      if (row === "monsters" && inst.position === "defense") zone.classList.add("is-defense");
      if (targets.has(inst.uid)) zone.classList.add("is-target");
      if (ready.has(inst.uid)) zone.classList.add("is-ready");
      if (!inst.faceDown) {
        const name = document.createElement("span");
        name.className = "zone-name";
        name.textContent = card.name;
        zone.append(name);
        if (row === "monsters") {
          const stat = document.createElement("span");
          stat.className = "zone-stat";
          const s = effectiveStats(state, side, inst);
          stat.textContent = inst.position === "attack" ? `${s.atk}` : `${s.def}D`;
          zone.append(stat);
        }

      zone.title = inst.faceDown ? "Face-down card" : `${card.name}${card.kind === "monster" ? ` — ${card.atk}/${card.def}` : ""}`;

    byUid.get(action.uid).push(action);

    const card = getCard(inst.cardId);
    const options = byUid.get(inst.uid) ?? [];

    button.className = "card";
    button.type = "button";
    button.disabled = options.length === 0;
    button.style.setProperty("--card-accent", accentFor(card));
    button.innerHTML = `
      <div class="card-top">
        <span class="card-kind">${KIND_LABEL[card.kind]}</span>
        ${card.kind === "monster" ? `<span class="card-level">L${card.level}</span>` : ""}
      </div>
